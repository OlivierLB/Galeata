[workspace]
members = ["crates/agent-protocol"]

[package]
name = "galeata"
version = "0.1.0"
description = "Un IDE pour développer avec des agents"
authors = ["OlivierLB"]
edition = "2021"
default-run = "galeata"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "galeata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "galeata"
path = "src/main.rs"

[[bin]]
name = "galeata-mcp"
path = "src/bin/galeata-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.2"
rusqlite = { version = "0.43", features = ["bundled"] }
portable-pty = "0.9"
notify = "8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
keyring = { version = "3", features = ["sync-secret-service"] }
url = "2"
nix = { version = "0.29", features = ["signal", "process"] }
galeata-agent-protocol = { path = "crates/agent-protocol" }

[dev-dependencies]
tempfile = "3"
