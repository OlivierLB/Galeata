name: Release Galeata
# Publishes a GitHub Release when a v* tag is pushed. Started by hand
# (workflow_dispatch), it builds and smoke-tests everything without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04 # oldest supported glibc: the build runs on newer distributions too
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      GALEATA_CRASH_ENDPOINT: ${{ secrets.GALEATA_CRASH_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          prefix-key: v1-release-ubuntu22
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev file
      - name: Verify release commit belongs to main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Version consistency
        run: |
          node -e '
            const fs = require("fs");
            const versions = {
              "package.json": JSON.parse(fs.readFileSync("package.json")).version,
              "tauri.conf.json": JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version,
              "Cargo.toml": /^version = "(.+)"/m.exec(fs.readFileSync("src-tauri/Cargo.toml", "utf8"))[1],
            };
            const unique = new Set(Object.values(versions));
            if (unique.size !== 1) { console.error("Versions divergentes", versions); process.exit(1); }
            const tag = process.env.GITHUB_REF_TYPE === "tag" ? process.env.GITHUB_REF_NAME : null;
            if (tag && tag !== "v" + [...unique][0]) { console.error(`Tag ${tag} ≠ version ${[...unique][0]}`); process.exit(1); }
            fs.writeFileSync("VERSION", "v" + [...unique][0]);
            console.log("Version", [...unique][0]);'
      - name: Require crash relay for published releases
        if: github.ref_type == 'tag'
        run: |
          case "$GALEATA_CRASH_ENDPOINT" in
            https://*/crashes) ;;
            *) echo 'Crash endpoint missing or invalid'; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run package -- --bundles appimage,deb
      - run: node scripts/check-package.mjs
      - name: Release assets
        run: |
          mkdir release
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/galeata-linux-x86_64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb release/galeata-linux-amd64.deb
          cp VERSION release/VERSION
          (cd release && sha256sum galeata-linux-x86_64.AppImage galeata-linux-amd64.deb > SHA256SUMS)
          ls -l release && cat release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: galeata-release
          path: release/

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: galeata-release
          path: release
      # Minimal desktop graphics runtime plus test tools; no GTK, WebKit or FUSE.
      - run: |
          docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} sh -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates xvfb xauth dbus \
              libfontconfig1 libwayland-client0 libfribidi0 libharfbuzz0b \
              libgbm1 libegl1 libgles2 libgl1-mesa-dri fonts-dejavu-core >/dev/null
            useradd -m tester
            su tester -c "GALEATA_DOWNLOAD_URL=file:///src/release sh /src/scripts/smoke-release.sh /src/install.sh"'

  publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs: smoke
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release # restricted to v* tags
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: galeata-release
          path: release
      # Signed SLSA provenance: `gh attestation verify <file> -R OlivierLB/Galeata`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/galeata-linux-x86_64.AppImage
            release/galeata-linux-amd64.deb
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Galeata ${GITHUB_REF_NAME#v}" --generate-notes
