name: Documentation and wiki
# Translate and publish in one run: GITHUB_TOKEN commits do not trigger workflows.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - docs/**
      - scripts/translate-docs.py
      - scripts/requirements-docs.txt
      - scripts/check-docs.mjs
      - scripts/sync-wiki.mjs
      - tests/test_translate_docs.py
      - tests/docs.test.mjs
      - tests/sync-wiki.test.mjs
      - .github/workflows/wiki.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  sync:
    # Standard runners are free on public repositories; never run on a private copy.
    if: github.repository == 'OlivierLB/Galeata' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-docs.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/galeata-docs
          key: docs-argos-linux-v1-${{ hashFiles('scripts/requirements-docs.txt', 'docs/translation.json') }}
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-docs.txt
      - name: Test documentation tooling
        run: |
          python -m unittest discover -s tests -p 'test_translate_docs.py' -v
          node --test tests/sync-wiki.test.mjs tests/docs.test.mjs
      - name: Translate and verify before writing to GitHub
        run: |
          npm run docs:translate
          npm run docs:check
          npm run docs:check-translations
      - name: Commit generated English documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- docs/en docs/translation-cache.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m 'docs: update automatic English translations'
            gh auth setup-git
            # A concurrent change to main rejects this push; never force it.
            git push --quiet origin HEAD:main
          fi
      - name: Sync docs into the wiki
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          sha=$(git rev-parse HEAD)
          wiki="$RUNNER_TEMP/galeata-wiki"
          gh auth setup-git
          if ! git clone --quiet --depth 1 "${SERVER}/${REPO}.wiki.git" "$wiki"; then
            echo "::error::Wiki introuvable. Créez une première page sur ${SERVER}/${REPO}/wiki puis relancez ce workflow."
            exit 1
          fi
          node scripts/sync-wiki.mjs . "$wiki" "${SERVER}/${REPO}"
          cd "$wiki"
          git add -A
          if git diff --cached --quiet; then echo "Wiki déjà à jour."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Sync from ${REPO}@${sha}"
          git push --quiet origin HEAD
          echo "Wiki mis à jour depuis ${sha}."
