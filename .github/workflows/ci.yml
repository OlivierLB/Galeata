name: Validate Galeata
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev ripgrep
      - run: npm install
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml --bins
      - run: npm run package -- --bundles deb
      - run: node scripts/check-package.mjs
      - name: Export initial dependency snapshot
        if: always()
        run: node scripts/export-lockfiles.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: galeata-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
