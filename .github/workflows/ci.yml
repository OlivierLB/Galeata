name: Validate Galeata
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  crash-relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --prefix services/crash-relay/cloudflare
      - run: npm test --prefix services/crash-relay/cloudflare
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Browsers are cached per Playwright version; system libraries are
      # still installed each run since they live outside the cache.
      - id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu24-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ubuntu22
          cache-on-failure: true
      # build-essential ships with the runner image.
      - uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # v1.5.3
        with:
          packages: libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev ripgrep
          version: ubuntu22-v1
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: python3 -m unittest discover -s tests -p 'test_install_*.py' -v
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets
      # The release build and .deb check run on main, tags, and on branches
      # touching what goes into the package. Fails safe: any doubt packages.
      - id: package-scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha || 'main' }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          package=true
          case "$EVENT:$REF" in
            pull_request:*|push:refs/heads/*)
              if [ "$REF" != refs/heads/main ] \
                && files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" --jq 'if (.files | length) >= 300 then "TRUNCATED" else .files[].filename end') \
                && ! printf '%s\n' "$files" | grep -qE '^(TRUNCATED$|src-tauri/|scripts/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)'; then
                package=false
              fi ;;
          esac
          echo "Packaging: $package ($EVENT $REF, base $BASE)"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - if: steps.package-scope.outputs.package == 'true'
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bins
      - if: steps.package-scope.outputs.package == 'true'
        run: npm run package -- --bundles deb
      - if: steps.package-scope.outputs.package == 'true'
        run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-lockfiles
          path: |
            package-lock.json
            src-tauri/Cargo.lock
      - if: steps.package-scope.outputs.package == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: galeata-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
