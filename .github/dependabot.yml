version: 2
updates:
  - package-ecosystem: npm
    directory: /services/crash-relay/cloudflare
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      # 0.58 moved the TypeScript language API; re-enable once the Monaco
      # migration lands (see docs/dependabot.md).
      - dependency-name: monaco-editor
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
